<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>auto-answer mock · 三编辑器自证页</title>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; margin: 24px; background: #f6f7f9; color: #1a1a1a; }
  h1 { font-size: 20px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .card { background: #fff; border: 1px solid #dcdfe4; border-radius: 8px; padding: 12px; }
  .card h2 { font-size: 14px; margin: 0 0 8px; color: #444; }
  textarea { width: 100%; height: 140px; font-family: Consolas, monospace; font-size: 13px; box-sizing: border-box; }
  #ce { border: 1px solid #ccc; min-height: 140px; padding: 8px; font-family: Consolas, monospace; font-size: 13px; background: #fff; }
  .problem { background: #fff; border: 1px solid #dcdfe4; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .problem h3 { margin: 0 0 8px; font-size: 15px; }
  pre { background: #f0f2f5; padding: 8px; border-radius: 4px; font-size: 12px; }
  button { padding: 6px 14px; font-size: 13px; cursor: pointer; }
  #log { font-family: Consolas, monospace; font-size: 12px; color: #555; margin-top: 8px; }
</style>
</head>
<body>

<h1>auto-answer · mock 答题页</h1>

<div class="problem" id="problem">
  <h3 id="qTitle">A + B Problem</h3>
  <div id="qBody">
    <p>给定两个整数 A 和 B，输出它们的和。</p>
    <p><b>输入格式</b>：一行两个整数 A、B（-10^9 ≤ A, B ≤ 10^9）。</p>
    <p><b>输出格式</b>：一行一个整数，表示 A + B。</p>
    <p><b>样例输入</b>：</p>
    <pre id="sampleIn">1 2</pre>
    <p><b>样例输出</b>：</p>
    <pre id="sampleOut">3</pre>
    <p><b>限制</b>：时间限制 1s，内存限制 256MB。</p>
  </div>
</div>

<div class="row">
  <div class="card">
    <h2>① textarea</h2>
    <textarea id="ta" placeholder="在此编写代码"></textarea>
  </div>
  <div class="card">
    <h2>② contenteditable</h2>
    <div id="ce" contenteditable="true" spellcheck="false"></div>
  </div>
</div>

<div class="card" style="margin-bottom:16px;">
  <h2>③ Monaco（CDN 加载，离线时自动跳过）</h2>
  <div style="margin-bottom:8px;">
    <label for="lang">语言：</label>
    <select id="lang">
      <option value="python">Python 3</option>
      <option value="cpp">C++17 (GCC 9.2)</option>
      <option value="c">C (gcc 9)</option>
      <option value="java">Java (OpenJDK 17)</option>
      <option value="javascript">JavaScript (Node.js)</option>
      <option value="go">Go 1.20</option>
      <option value="rust">Rust 1.70</option>
      <option value="csharp">C# (.NET 6)</option>
      <option value="kotlin">Kotlin 1.8</option>
    </select>
  </div>
  <div id="monaco" style="height:160px;border:1px solid #ccc;"></div>
</div>

<div>
  <button id="btnRun">运行</button>
  <button id="btnSubmit">提交</button>
  <button id="btnNext">下一题（模拟切题）</button>
  <div id="log"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<script>
  const logEl = document.getElementById('log');
  const log = (m) => { logEl.textContent = m; };

  document.getElementById('btnRun').onclick = () => log('run clicked');
  document.getElementById('btnSubmit').onclick = () => log('submit clicked');
  document.getElementById('btnNext').onclick = () => {
    const n = Number(window.__qIndex || 0) + 1;
    window.__qIndex = n;
    document.getElementById('qTitle').textContent = `题目 #${n}: A + B（第 ${n} 题）`;
    document.getElementById('qBody').insertAdjacentHTML('beforeend',
      `<p>附加说明 ${n}：第 ${n} 题的额外约束。</p>`);
    document.getElementById('ta').value = '';
    document.getElementById('ce').textContent = '';
    if (window.__monacoEditor) window.__monacoEditor.setValue('');
    log('question switched to #' + n);
  };

  // Language selector: switching it re-creates the editor, like a real OJ.
  const langSel = document.getElementById('lang');
  const MODE = { python: 'python', cpp: 'cpp', c: 'c', java: 'java', javascript: 'javascript', go: 'go', rust: 'rust', csharp: 'csharp', kotlin: 'kotlin' };
  langSel.addEventListener('change', () => {
    if (!window.__monacoEditor) return;
    const mode = MODE[langSel.value] || 'plaintext';
    monaco.editor.setModelLanguage(window.__monacoEditor.getModel(), mode);
    window.__monacoEditor.setValue('');
    log('language switched to ' + langSel.value);
  });

  // Monaco via CDN; the mock page still works without it.
  if (window.require) {
    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
    require(['vs/editor/editor.main'], () => {
      window.__monacoEditor = monaco.editor.create(document.getElementById('monaco'), {
        value: '',
        language: 'python',
        automaticLayout: true,
        minimap: { enabled: false },
      });
      log('monaco ready');
    });
  } else {
    log('monaco CDN unavailable — textarea + contenteditable only');
  }
</script>
</body>
</html>
