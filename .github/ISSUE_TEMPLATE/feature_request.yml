name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先说清楚「你想解决什么问题」，比直接说「加一个 XX 功能」更容易被采纳。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 现在的用法里，哪里让你觉得别扭、慢、或者做不了？
      placeholder: 例如：题目页面的样例在最下面，截图经常截不到，导致自检被跳过
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的方案
      placeholder: 例如：截图前自动滚动到页面底部，或者支持分两次截图拼接
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其它办法
      description: 你现在是怎么绕过这个问题的？
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 这个改动涉及哪部分
      options:
        - 截图与识别
        - 模型调用 / 提示词
        - 样例自检
        - 剪贴板与投递
        - 快捷键与进程管理
        - 浏览器模式（CDP）
        - 配置与安装
        - 文档
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      description: 这个项目有几条明确不做的边界
      options:
        - label: 我的建议不涉及伪装浏览器指纹或绕过监考检测
          required: true
        - label: 我的建议不引入第三方运行时依赖（项目当前零依赖）
          required: false